<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>vLLM Tester</title>
<link rel="stylesheet" href="vllm-tester-base.css">
</head>
<body>

<h1>vLLM Tester</h1>

<!-- Import / Export 툴바 -->
<div class="toolbar">
  <button id="importBtn">📥 Request JSON Import</button>
  <button id="exportBtn">📤 Request JSON Export</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
  <span id="ioStatus" class="io-status"></span>
</div>

<!-- Endpoint 표시부 -->
<fieldset>
  <legend>Endpoint</legend>

  <!-- 서버 모드: Python 프록시 경유 -->
  <p id="ep-server" class="ep-server" hidden>
    프록시 경로: <code id="targetDisplay" class="ep-target"></code>
    &nbsp;·&nbsp; vLLM <span id="versionDisplay"></span>
  </p>

  <!-- 로컬 모드: 직접 파일로 열었을 때 -->
  <div id="ep-local" hidden>
    <div class="row ep-connect-row">
      <div>
        <label>vLLM Base URL</label>
        <input id="baseUrl" type="text" placeholder="http://localhost:8000">
      </div>
      <div class="ep-connect-actions">
        <button id="connectBtn" class="ep-connect-btn">Connect</button>
        <span id="connectStatus" class="ep-connect-status"></span>
      </div>
    </div>
  </div>

  <!-- 공통: Model + API Key -->
  <div class="row">
    <div>
      <label>Model</label>
      <select id="model"></select>
    </div>
    <div id="ep-apikey">
      <label>API Key (선택 — 비우면 헤더에 미포함)</label>
      <input id="apiKey" type="password">
    </div>
  </div>
</fieldset>

<!-- Hyperparameters -->
<fieldset>
  <legend>Hyperparameters</legend>
  <details>
  <summary class="hp-summary">비워두면 전송 안함</summary>
  <div class="hyperparams" id="hyperparams">
    <div><label>temperature</label><input id="hp-temperature" type="number" step="0.01" placeholder="1.0"></div>
    <div><label>top_p</label><input id="hp-top_p" type="number" step="0.01" placeholder="1.0"></div>
    <div><label>top_k</label><input id="hp-top_k" type="number" step="1" placeholder="-1"></div>
    <div><label>min_p</label><input id="hp-min_p" type="number" step="0.01" placeholder="0.0"></div>
    <div><label>max_tokens</label><input id="hp-max_tokens" type="number" step="1" placeholder="(max_model_len)"></div>
    <div><label>min_tokens</label><input id="hp-min_tokens" type="number" step="1" placeholder="0"></div>
    <div><label>presence_penalty</label><input id="hp-presence_penalty" type="number" step="0.01" placeholder="0.0"></div>
    <div><label>frequency_penalty</label><input id="hp-frequency_penalty" type="number" step="0.01" placeholder="0.0"></div>
    <div><label>repetition_penalty</label><input id="hp-repetition_penalty" type="number" step="0.01" placeholder="1.0"></div>
    <div><label>n</label><input id="hp-n" type="number" step="1" placeholder="1"></div>
    <div><label>seed</label><input id="hp-seed" type="number" step="1" placeholder="-1"></div>
    <div><label>top_logprobs</label><input id="hp-top_logprobs" type="number" step="1" placeholder="0"></div>
    <div><label>stop <small>(쉼표로 구분)</small></label><input id="hp-stop" type="text"></div>
    <div><label>tool_choice <small>(auto/none/required/JSON)</small></label><input id="hp-tool_choice" type="text" placeholder="auto"></div>
    <div style="grid-column:1/-1;"></div>
    <div><label>stream</label><select id="hp-stream"><option value="">미전송(false)</option><option value="true">true</option><option value="false">false</option></select></div>
    <div><label>stream_options.include_usage</label><select id="hp-stream-include-usage"><option value="">미전송</option><option value="true">true</option><option value="false">false</option></select></div>
    <div><label>logprobs</label><select id="hp-logprobs"><option value="">미전송(false)</option><option value="true">true</option><option value="false">false</option></select></div>
    <div><label>ignore_eos</label><select id="hp-ignore_eos"><option value="">미전송(false)</option><option value="true">true</option><option value="false">false</option></select></div>
    <div><label>skip_special_tokens</label><select id="hp-skip_special_tokens"><option value="">미전송(true)</option><option value="true">true</option><option value="false">false</option></select></div>
    <div style="grid-column:1/-1;"></div>
    <div><label>response_format</label><select id="hp-response_format"><option value="">미전송(text)</option><option value="json_object">json_object</option><option value="json_schema">json_schema</option></select></div>
  </div>
  <div id="hp-rf-schema" class="hp-rf-schema" hidden>
    <label>json_schema 값 (JSON 객체)</label>
    <textarea id="hp-rf-schema-ta" rows="5" spellcheck="false" placeholder='{"name":"my_schema","strict":true,"schema":{"type":"object","properties":{}}}'></textarea>
    <div class="validation" id="hp-rf-schema-val"></div>
  </div>
  </details>
</fieldset>

<!-- Tools 리스트 편집창 -->
<fieldset>
  <legend>Tools</legend>
  <div id="toolsList">
    <div class="clear-row"><button id="clearTools">× 전체 삭제</button></div>
    <p class="empty">— Tool 없음 —</p>
    <div class="items"></div>
  </div>
  <div class="add-row"><button id="addTool">+ Tool 추가</button></div>
</fieldset>

<!-- Messages 리스트 편집창 -->
<fieldset>
  <legend>Messages</legend>
  <div id="messagesList">
    <div class="clear-row"><button id="clearMessages">× 전체 삭제</button></div>
    <p class="empty">— Message 없음 —</p>
    <div class="items"></div>
  </div>
  <div class="add-row"><button id="addMessage">+ Message 추가</button></div>
</fieldset>

<!-- 전송버튼 -->
<div class="send-bar">
  <button id="sendBtn" class="send-btn">SEND</button>
</div>

<!-- Request Preview (SEND 후 갱신) -->
<details id="reqPreviewDetails" class="req-preview">
  <summary>Request Body 보기</summary>
  <pre id="reqPreviewPre"></pre>
</details>

<!-- Response -->
<fieldset>
  <legend>Response</legend>
  <div id="response">
    <p class="empty">아직 응답이 없습니다.</p>
    <p    class="r-status"       hidden></p>
    <div class="r-error" hidden><label>Error</label><pre></pre></div>
    <div class="r-body"  hidden><label>Body</label><pre></pre></div>
    <div class="items"></div>
    <details class="r-usage"    hidden><summary>Usage</summary><pre></pre></details>
    <details class="r-logprobs" hidden><summary>Logprobs</summary><pre></pre></details>
  </div>
</fieldset>

<!-- Templates -->
<template id="tpl-tool">
  <div class="item list-item tool-item">
    <div class="item-head">
      <div class="left"><b>Tool</b></div>
      <div class="right">
        <button data-act="up">↑</button>
        <button data-act="down">↓</button>
        <button data-act="del">×</button>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Name</label>
        <input class="t-name" type="text" placeholder="get_weather">
      </div>
      <div>
        <label>Description</label>
        <textarea class="t-desc" rows="2" placeholder="Get the current weather..."></textarea>
      </div>
    </div>
    <label>Parameters (JSON Schema)</label>
    <textarea class="t-params" rows="8" spellcheck="false"></textarea>
    <div class="validation"></div>
  </div>
</template>

<template id="tpl-tool-call">
  <div class="tool-call item">
    <div class="item-head">
      <div class="left"><b>Tool Call</b></div>
      <div class="right">
        <button data-act="up">↑</button>
        <button data-act="down">↓</button>
        <button data-act="del">×</button>
      </div>
    </div>
    <div class="row">
      <div>
        <label>ID</label>
        <input class="tc-id" type="text">
      </div>
      <div>
        <label>Function Name</label>
        <input class="tc-name" type="text">
      </div>
    </div>
    <label>Arguments (JSON 문자열)</label>
    <textarea class="tc-args" rows="3" spellcheck="false"></textarea>
    <div class="validation"></div>
  </div>
</template>

<template id="tpl-message">
  <div class="item list-item message-item">
    <div class="item-head">
      <div class="left">
        <select class="role-select">
          <option value="system">system</option>
          <option value="user">user</option>
          <option value="assistant">assistant</option>
          <option value="tool">tool</option>
        </select>
      </div>
      <div class="right">
        <button data-act="up">↑</button>
        <button data-act="down">↓</button>
        <button data-act="del">×</button>
      </div>
    </div>
    <div class="f-reasoning">
      <label>Reasoning Content (선택)</label>
      <textarea rows="3" spellcheck="false"></textarea>
    </div>
    <div class="f-tool-call-id">
      <label>Tool Call ID</label>
      <input type="text" placeholder="call_xxxxx">
    </div>
    <div class="f-content">
      <label>Content</label>
      <textarea rows="3" spellcheck="false"></textarea>
    </div>
    <div class="f-tool-calls">
      <label>Tool Calls</label>
      <div class="tc-container">
        <div class="clear-row"><button class="clear-tc-btn">× 전체 삭제</button></div>
        <p class="empty">— 없음 —</p>
        <div class="items"></div>
      </div>
      <div class="add-row"><button class="add-tc-btn">+ Tool Call 추가</button></div>
    </div>
  </div>
</template>

<template id="tpl-response-choice">
  <div class="item list-item response-item">
    <h3 class="r-title"></h3>
    <button class="copy-btn">↓ Messages 에 assistant 로 추가</button>
    <label class="r-reasoning-label" hidden>Reasoning</label>
    <pre  class="r-reasoning"        hidden></pre>
    <label class="r-content-label"   hidden>Content</label>
    <pre  class="r-content"          hidden></pre>
    <label class="r-tc-label"        hidden>Tool Calls</label>
    <pre  class="r-tc"               hidden></pre>
  </div>
</template>


<script>
/* 서버에서 시작 시 placeholder 를 실제 값으로 치환해서 주입
   { target: "...", models: ["...", ...] }
   직접 파일로 열면 치환이 안 되므로 null 로 폴백 */
try {
  window.__SERVER_CONFIG__ = __SERVER_CONFIG_JSON__;
} catch (e) {
  window.__SERVER_CONFIG__ = null;
}
</script>

<script>
function uid() { return Math.random().toString(36).slice(2, 11); }

function clearChildren(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function cloneTemplate(id) {
  return document.getElementById(id).content.cloneNode(true).firstElementChild;
}

var SERVER_MODE = window.__SERVER_CONFIG__ !== null && typeof window.__SERVER_CONFIG__ === 'object';

var $toolsList     = document.getElementById('toolsList');
var $messagesList  = document.getElementById('messagesList');
var $toolsItems    = $toolsList.querySelector('.items');
var $messagesItems = $messagesList.querySelector('.items');
var $model         = document.getElementById('model');
var $apiKey        = document.getElementById('apiKey');
var $sendBtn       = document.getElementById('sendBtn');
var $response      = document.getElementById('response');
var $reqPreviewPre = document.getElementById('reqPreviewPre');
var $ioStatus      = document.getElementById('ioStatus');
var $targetDisplay = document.getElementById('targetDisplay');
var $importFile    = document.getElementById('importFile');

var $responseItems = $response.querySelector('.items');
var $rStatus = $response.querySelector('.r-status');
var $rError  = $response.querySelector('.r-error');
var $rBody   = $response.querySelector('.r-body');
var $rUsage    = $response.querySelector('.r-usage');
var $rLogprobs = $response.querySelector('.r-logprobs');

function validateJsonSchema(text) {
  if (!text.trim()) return { ok: false, msg: '✗ 빈 값', cls: 'v-err' };
  var parsed;
  try { parsed = JSON.parse(text); } catch (e) {
    return { ok: false, msg: '✗ JSON 파싱 오류: ' + e.message, cls: 'v-err' };
  }
  if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
    return { ok: false, msg: '✗ 루트는 객체여야 합니다', cls: 'v-err' };
  }
  if (parsed.type === undefined) {
    return { ok: true, msg: '⚠ "type" 필드 권장 (보통 "object")', cls: 'v-warn' };
  }
  if (parsed.type === 'object') {
    if (parsed.properties !== undefined) {
      if (typeof parsed.properties !== 'object' || parsed.properties === null || Array.isArray(parsed.properties)) {
        return { ok: false, msg: '✗ "properties"는 객체여야 합니다', cls: 'v-err' };
      }
      var propKeys = Object.keys(parsed.properties);
      for (var pi = 0; pi < propKeys.length; pi++) {
        var pv = parsed.properties[propKeys[pi]];
        if (typeof pv !== 'object' || pv === null || Array.isArray(pv)) {
          return { ok: false, msg: '✗ properties.' + propKeys[pi] + ' 는 객체여야 합니다', cls: 'v-err' };
        }
      }
    }
    if (parsed.required !== undefined) {
      if (!Array.isArray(parsed.required)) {
        return { ok: false, msg: '✗ "required"는 배열이어야 합니다', cls: 'v-err' };
      }
      if (parsed.properties) {
        var rKeys = Object.keys(parsed.properties);
        var missing = parsed.required.filter(function(r) { return rKeys.indexOf(r) === -1; });
        if (missing.length > 0) {
          return { ok: true, msg: '⚠ required 에 properties 외 키: ' + missing.join(', '), cls: 'v-warn' };
        }
      }
    }
  }
  return { ok: true, msg: '✓ 구조 OK (정식 JSON Schema 스펙 검증은 아님)', cls: 'v-ok' };
}

function validateJsonString(text) {
  if (!text.trim()) return { ok: false, msg: '⚠ 비어있음', cls: 'v-warn' };
  try {
    JSON.parse(text);
    return { ok: true, msg: '✓ 유효한 JSON', cls: 'v-ok' };
  } catch (e) {
    return { ok: false, msg: '✗ ' + e.message, cls: 'v-err' };
  }
}

function checkEmpty(container) {
  var itemsEl = container.querySelector('.items') || container;
  var hasItems = !!itemsEl.querySelector('.item');
  container.querySelector('p.empty').hidden = hasItems;
}

function attachItemButtonListeners(div, container, onchange) {
  div.querySelector('[data-act="up"]').addEventListener('click', function() {
    var prev = div.previousElementSibling;
    if (prev) { div.parentNode.insertBefore(div, prev); if (onchange) onchange(); }
  });
  div.querySelector('[data-act="down"]').addEventListener('click', function() {
    var next = div.nextElementSibling;
    if (next) { div.parentNode.insertBefore(next, div); if (onchange) onchange(); }
  });
  div.querySelector('[data-act="del"]').addEventListener('click', function() {
    div.remove();
    checkEmpty(container);
    if (onchange) onchange();
  });
}

/* ============================================================================
 * Tools
 * ========================================================================== */

function createToolElement(init) {
  if (!init) init = {};
  var div = cloneTemplate('tpl-tool');
  div.querySelector('.t-name').value = init.name || '';
  div.querySelector('.t-desc').value = init.description || '';
  var paramsIn = div.querySelector('.t-params');
  paramsIn.value = init.parameters || '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}';
  var valEl = div.querySelector('.validation');
  function updateValidation() {
    var r = validateJsonSchema(paramsIn.value);
    valEl.textContent = r.msg;
    valEl.className = 'validation ' + r.cls;
  }
  updateValidation();
  paramsIn.addEventListener('input', updateValidation);
  attachItemButtonListeners(div, $toolsList);
  return div;
}

function addTool() {
  $toolsItems.appendChild(createToolElement());
  checkEmpty($toolsList);
}


/* ============================================================================
 * Tool Calls (assistant message 내부 자식 항목)
 * ========================================================================== */

function createToolCallElement(init, container) {
  if (!init) init = {};
  var div = cloneTemplate('tpl-tool-call');
  div.querySelector('.tc-id').value   = init.id || ('call_' + uid());
  div.querySelector('.tc-name').value = init.name || '';
  var argsIn = div.querySelector('.tc-args');
  argsIn.value = init.arguments || '{}';
  var valEl = div.querySelector('.validation');
  function updateVal() {
    var r = validateJsonString(argsIn.value);
    valEl.textContent = r.msg;
    valEl.className = 'validation ' + r.cls;
  }
  updateVal();
  argsIn.addEventListener('input', updateVal);
  attachItemButtonListeners(div, container);
  return div;
}


/* ============================================================================
 * Messages
 * ========================================================================== */

function createMessageElement(init) {
  if (!init) init = {};
  var role = init.role || 'user';
  var div = cloneTemplate('tpl-message');

  var roleSelect  = div.querySelector('.role-select');
  var fReasoning  = div.querySelector('.f-reasoning');
  var fTci        = div.querySelector('.f-tool-call-id');
  var fContent    = div.querySelector('.f-content');
  var fTc         = div.querySelector('.f-tool-calls');
  var tcContainer = div.querySelector('.tc-container');
  var tcItems     = tcContainer.querySelector('.items');

  roleSelect.value = role;
  fReasoning.querySelector('textarea').value = init.reasoning_content || '';
  fTci.querySelector('input').value          = init.tool_call_id || '';
  fContent.querySelector('textarea').value   = init.content || '';

  if (Array.isArray(init.tool_calls)) {
    init.tool_calls.forEach(function(tc) { tcItems.appendChild(createToolCallElement(tc, tcContainer)); });
  }
  checkEmpty(tcContainer);

  div.querySelector('.add-tc-btn').addEventListener('click', function() {
    tcItems.appendChild(createToolCallElement({}, tcContainer));
    checkEmpty(tcContainer);
  });
  div.querySelector('.clear-tc-btn').addEventListener('click', function() {
    clearChildren(tcItems);
    checkEmpty(tcContainer);
  });

  function applyRole(r) {
    fReasoning.hidden = r !== 'assistant';
    fTci.hidden       = r !== 'tool';
    fTc.hidden        = r !== 'assistant';
  }
  applyRole(role);
  roleSelect.addEventListener('change', function() { applyRole(roleSelect.value); });

  attachItemButtonListeners(div, $messagesList);
  return div;
}

function addMessage() {
  var items = $messagesItems.querySelectorAll('.message-item');
  var role = 'user';
  if (items.length === 0) {
    role = 'system';
  } else {
    var lastRole = items[items.length - 1].querySelector('.role-select').value;
    if (lastRole === 'user' || lastRole === 'tool') role = 'assistant';
    else if (lastRole === 'assistant')              role = 'user';
  }
  $messagesItems.appendChild(createMessageElement({ role: role }));
  checkEmpty($messagesList);
}

/* ============================================================================
 * Request
 * ========================================================================== */
function buildRequest() {
  var base   = SERVER_MODE ? '' : document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
  var url    = base + '/v1/chat/completions';
  var model  = $model.value.trim();
  var apiKey = $apiKey.value.trim();

  var body = {};
  if (model) body.model = model;

  var msgDivs = $messagesItems.querySelectorAll('.message-item');
  body.messages = [];
  for (var mi = 0; mi < msgDivs.length; mi++) {
    var md = msgDivs[mi];
    var role = md.querySelector('.role-select').value;
    if (role === 'system' || role === 'user') {
      body.messages.push({ role: role, content: md.querySelector('.f-content textarea').value });
    } else if (role === 'assistant') {
      var out = { role: 'assistant', content: md.querySelector('.f-content textarea').value };
      var rc = md.querySelector('.f-reasoning textarea').value;
      if (rc) out.reasoning_content = rc;
      var tcDivs = md.querySelectorAll('.tc-container .items .tool-call');
      if (tcDivs.length) {
        out.tool_calls = [];
        for (var ti = 0; ti < tcDivs.length; ti++) {
          out.tool_calls.push({
            id: tcDivs[ti].querySelector('.tc-id').value,
            type: 'function',
            function: { name: tcDivs[ti].querySelector('.tc-name').value, arguments: tcDivs[ti].querySelector('.tc-args').value },
          });
        }
      }
      body.messages.push(out);
    } else if (role === 'tool') {
      body.messages.push({
        role: 'tool',
        tool_call_id: md.querySelector('.f-tool-call-id input').value,
        content: md.querySelector('.f-content textarea').value,
      });
    }
  }

  var toolDivs = $toolsItems.querySelectorAll('.item');
  if (toolDivs.length > 0) {
    body.tools = [];
    for (var tdi = 0; tdi < toolDivs.length; tdi++) {
      var paramsStr = toolDivs[tdi].querySelector('.t-params').value;
      var params;
      try { params = JSON.parse(paramsStr); } catch (e) { params = paramsStr; }
      body.tools.push({
        type: 'function',
        function: {
          name:        toolDivs[tdi].querySelector('.t-name').value,
          description: toolDivs[tdi].querySelector('.t-desc').value,
          parameters:  params,
        },
      });
    }
  }

  function hpStr(key) { return document.getElementById('hp-' + key).value; }
  function hpNum(key) { var v = hpStr(key); if (v) { var n = Number(v); if (!isNaN(n)) body[key] = n; } }
  function hpBool(key) { var v = hpStr(key); if (v) body[key] = v === 'true'; }

  hpNum('temperature'); hpNum('top_p'); hpNum('top_k'); hpNum('min_p');
  hpNum('max_tokens'); hpNum('min_tokens');
  hpNum('presence_penalty'); hpNum('frequency_penalty'); hpNum('repetition_penalty');
  hpNum('n'); hpNum('seed'); hpNum('top_logprobs');

  var stopRaw = hpStr('stop');
  if (stopRaw) body.stop = stopRaw.split(',').map(function(s) { return s.trim(); }).filter(Boolean);

  var tcRaw = hpStr('tool_choice');
  if (tcRaw) { try { body.tool_choice = JSON.parse(tcRaw); } catch (e) { body.tool_choice = tcRaw; } }

  var rfVal = hpStr('response_format');
  if (rfVal === 'json_object') {
    body.response_format = { type: 'json_object' };
  } else if (rfVal === 'json_schema') {
    var schemaText = document.getElementById('hp-rf-schema-ta').value.trim();
    var schemaObj = null;
    if (schemaText) { try { schemaObj = JSON.parse(schemaText); } catch (e) {} }
    body.response_format = { type: 'json_schema', json_schema: schemaObj || {} };
  }

  hpBool('stream'); hpBool('logprobs'); hpBool('ignore_eos'); hpBool('skip_special_tokens');

  var siuVal = document.getElementById('hp-stream-include-usage').value;
  if (siuVal) body.stream_options = { include_usage: siuVal === 'true' };

  return { url: url, apiKey: apiKey, body: body };
}


/* ============================================================================
 * Request View
 * ========================================================================== */

function renderRequestView(body) {
  $reqPreviewPre.textContent = JSON.stringify(body, null, 2);
}


/* ============================================================================
 * 전송 / 응답 표시
 *    - 일반 응답: JSON으로 파싱해서 choice/usage 표시
 *    - SSE 스트리밍: data: 라인을 누적해서 실시간으로 표시
 *    - 각 choice / 스트리밍 결과 옆에 "Messages 에 assistant 로 추가" 버튼
 * ========================================================================== */

function copyResponseToMessage(responseMessage) {
  var reasoning = responseMessage.reasoning_content || responseMessage.reasoning || '';
  var tcs = Array.isArray(responseMessage.tool_calls) ? responseMessage.tool_calls : [];
  var init = {
    role: 'assistant',
    content: responseMessage.content || '',
    reasoning_content: reasoning,
    tool_calls: tcs.map(function(tc) {
      return {
        id:        tc.id || ('call_' + uid()),
        name:      (tc.function && tc.function.name) || tc.name || '',
        arguments: (tc.function && tc.function.arguments) || tc.arguments || '',
      };
    }),
  };
  var newEl = createMessageElement(init);
  $messagesItems.appendChild(newEl);
  checkEmpty($messagesList);
  newEl.scrollIntoView(false);
}

function resetResponse() {
  clearChildren($responseItems);
  $response.querySelector('.empty').hidden = false;
  [$rStatus, $rError, $rBody, $rUsage, $rLogprobs].forEach(function(el) { el.hidden = true; });
}

var currentXhr = null;

function setSending(sending) {
  if (sending) {
    $sendBtn.textContent = '■ STOP';
    $sendBtn.classList.add('stop-btn');
  } else {
    $sendBtn.textContent = 'SEND';
    $sendBtn.classList.remove('stop-btn');
    currentXhr = null;
  }
}

function mergeStreamChunk(chunk, acc) {
  if (chunk.choices && chunk.choices[0]) {
    var ch = chunk.choices[0];
    var d  = ch.delta || {};
    if (d.content)           acc.content   += d.content;
    if (d.reasoning_content) acc.reasoning += d.reasoning_content;
    if (d.reasoning)         acc.reasoning += d.reasoning;
    if (d.tool_calls) {
      for (var i = 0; i < d.tool_calls.length; i++) {
        var tc = d.tool_calls[i];
        var idx = tc.index !== undefined ? tc.index : 0;
        if (!acc.tool_calls[idx]) {
          acc.tool_calls[idx] = { id: '', type: 'function', function: { name: '', arguments: '' } };
        }
        if (tc.id) acc.tool_calls[idx].id = tc.id;
        if (tc.function) {
          if (tc.function.name)      acc.tool_calls[idx].function.name      = tc.function.name;
          if (tc.function.arguments) acc.tool_calls[idx].function.arguments += tc.function.arguments;
        }
      }
    }
    if (ch.finish_reason) acc.finish = ch.finish_reason;
    if (ch.logprobs && ch.logprobs.content) {
      for (var li = 0; li < ch.logprobs.content.length; li++) acc.logprobs.push(ch.logprobs.content[li]);
    }
  }
  if (chunk.usage) acc.usage = chunk.usage;
}

function showInChoice(div, cls, labelCls, text) {
  if (!text) return;
  div.querySelector(labelCls).hidden = false;
  var pre = div.querySelector(cls);
  pre.hidden = false;
  pre.textContent = text;
}

function renderNormalResponse(xhr, ms) {
  var text = xhr.responseText;
  var json = null;
  try { json = JSON.parse(text); } catch (e) {}

  var ok = xhr.status >= 200 && xhr.status < 300;
  $rStatus.hidden    = false;
  $rStatus.className = 'r-status ' + (ok ? 'v-ok' : 'v-err');
  $rStatus.textContent = (ok ? '✓' : '✗') + ' ' + xhr.status + ' ' + xhr.statusText + ' · ' + ms + 'ms';

  if (json && Array.isArray(json.choices)) {
    for (var ci = 0; ci < json.choices.length; ci++) {
      var choice = json.choices[ci];
      var msg = choice.message || {};
      var div = cloneTemplate('tpl-response-choice');
      div.querySelector('.r-title').textContent =
        'Choice #' + ci + ' (finish_reason: ' + (choice.finish_reason || 'unknown') + ')';
      (function(m) {
        div.querySelector('.copy-btn').addEventListener('click', function() { copyResponseToMessage(m); });
      })(msg);
      var reasoning = msg.reasoning_content || msg.reasoning;
      if (reasoning) {
        div.querySelector('.r-reasoning-label').hidden = false;
        div.querySelector('.r-reasoning').hidden = false;
        div.querySelector('.r-reasoning').textContent = reasoning;
      }
      if (msg.content) {
        div.querySelector('.r-content-label').hidden = false;
        div.querySelector('.r-content').hidden = false;
        div.querySelector('.r-content').textContent = msg.content;
      }
      if (msg.tool_calls && msg.tool_calls.length > 0) {
        div.querySelector('.r-tc-label').hidden = false;
        div.querySelector('.r-tc').hidden = false;
        div.querySelector('.r-tc').textContent = JSON.stringify(msg.tool_calls, null, 2);
      }
      $responseItems.appendChild(div);
    }
    if (json.usage) {
      $rUsage.hidden = false;
      $rUsage.querySelector('pre').textContent = JSON.stringify(json.usage, null, 2);
    }
    var allLogprobs = json.choices.map(function(c) { return c.logprobs; }).filter(Boolean);
    if (allLogprobs.length > 0) {
      $rLogprobs.hidden = false;
      $rLogprobs.querySelector('pre').textContent = JSON.stringify(
        allLogprobs.length === 1 ? allLogprobs[0] : allLogprobs, null, 2);
    }
  } else if (json && json.error) {
    $rError.hidden = false;
    $rError.querySelector('pre').textContent = JSON.stringify(json.error, null, 2);
  } else {
    $rBody.hidden = false;
    $rBody.querySelector('pre').textContent = text;
  }
}

function sendRequest() {
  if (currentXhr) { currentXhr.abort(); return; }

  var req    = buildRequest();
  var url    = req.url;
  var apiKey = req.apiKey;
  var body   = req.body;

  if (!url) {
    resetResponse();
    $response.querySelector('.empty').hidden = true;
    $rStatus.hidden = false;
    $rStatus.className = 'r-status v-err';
    $rStatus.textContent = '✗ URL을 입력해주세요.';
    return;
  }

  setSending(true);
  resetResponse();
  $response.querySelector('.empty').hidden = true;
  $rStatus.hidden = false;
  $rStatus.className = 'r-status';
  $rStatus.textContent = '◌ 요청 전송 중...';

  var t0 = new Date().getTime();
  var wantStream = body.stream === true;
  var actuallyStreaming = false;
  var acc = { content: '', reasoning: '', tool_calls: [], finish: null, usage: null, logprobs: [] };
  var choiceDiv = null;
  var copyBtn = null;
  var pos = 0;

  var xhr = new XMLHttpRequest();
  currentXhr = xhr;
  xhr.open('POST', url, true);
  xhr.setRequestHeader('Content-Type', 'application/json');
  if (apiKey) xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);

  xhr.onreadystatechange = function() {
    if (xhr.readyState === 2) {
      var ct = xhr.getResponseHeader('content-type') || '';
      actuallyStreaming = wantStream && xhr.status < 400 && ct.indexOf('text/event-stream') !== -1;
      if (actuallyStreaming) {
        $rStatus.className = 'r-status v-ok';
        $rStatus.textContent = '◌ ' + xhr.status + ' (streaming) · 0ms';
        choiceDiv = cloneTemplate('tpl-response-choice');
        choiceDiv.querySelector('.r-title').textContent = 'Choice #0 (streaming...)';
        copyBtn = choiceDiv.querySelector('.copy-btn');
        copyBtn.disabled = true;
        copyBtn.textContent = '↓ Messages 에 추가 (스트리밍 완료 후 활성화)';
        $responseItems.appendChild(choiceDiv);
      }
    }
  };

  xhr.onprogress = function() {
    if (!actuallyStreaming) return;
    var ms = new Date().getTime() - t0;
    var newText = xhr.responseText.slice(pos);
    pos = xhr.responseText.length;
    var lines = newText.split('\n');
    for (var i = 0; i < lines.length; i++) {
      var trimmed = lines[i].trim();
      if (trimmed.indexOf('data:') !== 0) continue;
      var data = trimmed.slice(5).trim();
      if (data === '[DONE]') continue;
      try { mergeStreamChunk(JSON.parse(data), acc); } catch (e) {}
    }
    showInChoice(choiceDiv, '.r-reasoning', '.r-reasoning-label', acc.reasoning);
    showInChoice(choiceDiv, '.r-content',   '.r-content-label',   acc.content);
    showInChoice(choiceDiv, '.r-tc', '.r-tc-label', acc.tool_calls.length > 0 ? JSON.stringify(acc.tool_calls, null, 2) : '');
    $rStatus.textContent = '◌ ' + xhr.status + ' (streaming) · ' + ms + 'ms';
  };

  function finalizeStream(aborted) {
    var ms = new Date().getTime() - t0;
    if (aborted) {
      $rStatus.className = 'r-status v-warn';
      $rStatus.textContent = '⊘ 스트리밍 중단됨 · ' + ms + 'ms';
      choiceDiv.querySelector('.r-title').textContent = 'Choice #0 (중단됨)';
    } else {
      $rStatus.textContent = '✓ ' + xhr.status + ' ' + xhr.statusText + ' · finish: ' + (acc.finish || 'unknown') + ' · ' + ms + 'ms';
      choiceDiv.querySelector('.r-title').textContent = 'Choice #0 (finish_reason: ' + (acc.finish || 'unknown') + ')';
    }
    copyBtn.disabled = false;
    copyBtn.textContent = '↓ Messages 에 assistant 로 추가';
    copyBtn.addEventListener('click', function() {
      copyResponseToMessage({ content: acc.content, reasoning_content: acc.reasoning, tool_calls: acc.tool_calls });
    });
    if (acc.logprobs.length > 0) {
      $rLogprobs.hidden = false;
      $rLogprobs.querySelector('pre').textContent = JSON.stringify(acc.logprobs, null, 2);
    }
    if (acc.usage) {
      $rUsage.hidden = false;
      $rUsage.querySelector('pre').textContent = JSON.stringify(acc.usage, null, 2);
    }
  }

  xhr.onload = function() {
    var ms = new Date().getTime() - t0;
    if (actuallyStreaming) { finalizeStream(false); }
    else { renderNormalResponse(xhr, ms); }
    currentXhr = null;
    setSending(false);
    renderRequestView(body);
  };

  xhr.onabort = function() {
    var ms = new Date().getTime() - t0;
    if (actuallyStreaming && choiceDiv) { finalizeStream(true); }
    else {
      $rStatus.className = 'r-status v-warn';
      $rStatus.textContent = '⊘ 요청 중단됨 · ' + ms + 'ms';
    }
    currentXhr = null;
    setSending(false);
    renderRequestView(body);
  };

  xhr.onerror = function() {
    $rStatus.className = 'r-status v-err';
    $rStatus.textContent = '✗ 요청 실패 (CORS 또는 네트워크 오류일 수 있습니다)';
    currentXhr = null;
    setSending(false);
    renderRequestView(body);
  };

  xhr.send(JSON.stringify(body));
}


/* ============================================================================
 * 9. Import / Export
 *    - Export: 현재 입력 상태를 chat completion request body 형태의 JSON 파일로
 *              다운로드.
 *    - Import: 사용자가 고른 JSON 파일을 읽어, chat completion request 형태인지
 *              검증한 뒤 state 에 반영. 검증 실패 시 기존 state 는 건드리지 않고
 *              에러 메시지만 띄움.
 * ========================================================================== */

// 툴바 옆에 짧은 상태 메시지를 띄운다. type: 'ok'|'err'|'warn'|''
//   - 일정 시간 뒤에 자동으로 사라짐 (단, 그 사이 메시지가 바뀌었으면 그대로 둠)
function renderIoStatus(msg, type) {
  $ioStatus.textContent = msg;
  $ioStatus.className = type ? 'v-' + type : '';
  if (msg) {
    var delay = type === 'err' ? 8000 : 4000;
    var saved = msg;
    setTimeout(function() {
      if ($ioStatus.textContent === saved) { $ioStatus.textContent = ''; $ioStatus.className = ''; }
    }, delay);
  }
}

function exportRequestJson() {
  var req  = buildRequest();
  var json = JSON.stringify(req.body, null, 2);
  var blob = new Blob([json], { type: 'application/json' });
  var burl = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href   = burl;
  var ts   = new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14);
  a.download = 'chat-request-' + ts + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(burl);
  renderIoStatus('✓ Export 완료', 'ok');
}

function importRequestJson(file) {
  var reader = new FileReader();
  reader.onerror = function() { renderIoStatus('✗ 파일 읽기 실패', 'err'); };
  reader.onload  = function() {
    var parsed;
    try { parsed = JSON.parse(reader.result); } catch (e) {
      renderIoStatus('✗ JSON 파싱 실패: ' + e.message, 'err');
      return;
    }
    var result = parseImportedRequest(parsed);
    if (!result.ok) { renderIoStatus('✗ 검증 실패: ' + result.error, 'err'); return; }
    var note = renderImportedRequest(result.value);
    var v = result.value;
    renderIoStatus(
      '✓ Import 완료 (messages ' + v.messages.length +
      (v.tools.length ? ', tools ' + v.tools.length : '') +
      (note || '') + ')',
      note ? 'warn' : 'ok');
  };
  reader.readAsText(file);
}

function parseImportedRequest(obj) {
  if (typeof obj !== 'object' || obj === null || Array.isArray(obj)) {
    return { ok: false, error: '루트가 객체가 아닙니다' };
  }
  if (!Array.isArray(obj.messages)) {
    return { ok: false, error: '"messages" 배열이 없습니다' };
  }

  function contentToString(c) {
    if (typeof c === 'string') return c;
    if (c == null) return '';
    return JSON.stringify(c);
  }

  var messages = [];
  var validRoles = ['system', 'user', 'assistant', 'tool'];
  for (var i = 0; i < obj.messages.length; i++) {
    var m = obj.messages[i];
    if (typeof m !== 'object' || m === null) {
      return { ok: false, error: 'messages[' + i + '] 가 객체가 아닙니다' };
    }
    if (validRoles.indexOf(m.role) === -1) {
      return { ok: false, error: 'messages[' + i + '].role 이 유효하지 않음 (' + m.role + ')' };
    }
    var internal = { id: uid(), role: m.role };
    if (m.role === 'system' || m.role === 'user') {
      internal.content = contentToString(m.content);
    } else if (m.role === 'assistant') {
      internal.content = contentToString(m.content);
      internal.reasoning_content =
        typeof m.reasoning_content === 'string' ? m.reasoning_content :
        typeof m.reasoning         === 'string' ? m.reasoning : '';
      internal.tool_calls = [];
      if (Array.isArray(m.tool_calls)) {
        for (var j = 0; j < m.tool_calls.length; j++) {
          var tc = m.tool_calls[j];
          if (typeof tc !== 'object' || tc === null) {
            return { ok: false, error: 'messages[' + i + '].tool_calls[' + j + '] 가 객체가 아닙니다' };
          }
          var fnName = (tc.function && tc.function.name) || tc.name || '';
          var fnArgs = (tc.function && tc.function.arguments);
          internal.tool_calls.push({
            id:   tc.id || ('call_' + uid()),
            name: fnName,
            arguments: typeof fnArgs === 'string' ? fnArgs : (typeof tc.arguments === 'string' ? tc.arguments : ''),
          });
        }
      }
    } else if (m.role === 'tool') {
      internal.tool_call_id = typeof m.tool_call_id === 'string' ? m.tool_call_id : '';
      internal.content      = contentToString(m.content);
    }
    messages.push(internal);
  }

  var tools = [];
  if (obj.tools !== undefined) {
    if (!Array.isArray(obj.tools)) return { ok: false, error: '"tools" 가 배열이 아닙니다' };
    for (var ti = 0; ti < obj.tools.length; ti++) {
      var t = obj.tools[ti];
      if (typeof t !== 'object' || t === null) {
        return { ok: false, error: 'tools[' + ti + '] 가 객체가 아닙니다' };
      }
      var fn = t.function || t;
      tools.push({
        id: uid(),
        name:        typeof fn.name        === 'string' ? fn.name        : '',
        description: typeof fn.description === 'string' ? fn.description : '',
        parameters:  fn.parameters !== undefined
          ? JSON.stringify(fn.parameters, null, 2)
          : '{\n  "type": "object",\n  "properties": {},\n  "required": []\n}',
      });
    }
  }

  var hyperparams = {};
  function importNum(key)  { if (obj[key] != null) hyperparams[key] = String(obj[key]); }
  function importBool(key) { if (obj[key] != null) hyperparams[key] = obj[key] ? 'true' : 'false'; }

  importNum('temperature'); importNum('top_p'); importNum('top_k'); importNum('min_p');
  importNum('max_tokens'); importNum('min_tokens');
  importNum('presence_penalty'); importNum('frequency_penalty'); importNum('repetition_penalty');
  importNum('n'); importNum('seed'); importNum('top_logprobs');

  if (obj.stop != null)
    hyperparams.stop = Array.isArray(obj.stop) ? obj.stop.join(', ') : String(obj.stop);
  if (obj.tool_choice != null)
    hyperparams.tool_choice = typeof obj.tool_choice === 'string' ? obj.tool_choice : JSON.stringify(obj.tool_choice);
  if (obj.response_format != null) {
    var rf = obj.response_format;
    var rfType = (typeof rf === 'object' && rf !== null) ? (rf.type || '') : '';
    hyperparams.response_format = (rfType === 'json_object' || rfType === 'json_schema') ? rfType : '';
    if (rfType === 'json_schema' && rf.json_schema != null) {
      hyperparams.response_format_schema = JSON.stringify(rf.json_schema, null, 2);
    }
  }
  importBool('stream'); importBool('logprobs'); importBool('ignore_eos'); importBool('skip_special_tokens');

  return {
    ok: true,
    value: { model: typeof obj.model === 'string' ? obj.model : '', messages: messages, tools: tools, hyperparams: hyperparams },
  };
}

function renderImportedRequest(v) {
  var modelNote = '';
  if (v.model) {
    var opts = $model.options;
    var found = false;
    for (var oi = 0; oi < opts.length; oi++) {
      if (opts[oi].value === v.model) { found = true; break; }
    }
    if (found) $model.value = v.model;
    else modelNote = ', 모델 "' + v.model + '" 은 서버에 없어 무시';
  }

  clearChildren($toolsItems);
  v.tools.forEach(function(t) { $toolsItems.appendChild(createToolElement(t)); });
  checkEmpty($toolsList);

  clearChildren($messagesItems);
  v.messages.forEach(function(m) { $messagesItems.appendChild(createMessageElement(m)); });
  checkEmpty($messagesList);

  var hp = v.hyperparams;
  function setHp(key) { document.getElementById('hp-' + key).value = hp[key] || ''; }

  setHp('temperature'); setHp('top_p'); setHp('top_k'); setHp('min_p');
  setHp('max_tokens'); setHp('min_tokens');
  setHp('presence_penalty'); setHp('frequency_penalty'); setHp('repetition_penalty');
  setHp('n'); setHp('seed'); setHp('top_logprobs');
  setHp('stop'); setHp('tool_choice');
  document.getElementById('hp-response_format').value = hp.response_format || '';
  document.getElementById('hp-rf-schema').hidden = (hp.response_format !== 'json_schema');
  document.getElementById('hp-rf-schema-ta').value = hp.response_format_schema || '';
  validateRfSchema();
  setHp('stream'); setHp('logprobs'); setHp('ignore_eos'); setHp('skip_special_tokens');

  return modelNote;
}


/* ============================================================================
 * 10. 초기 실행
 * ========================================================================== */

function populateModels(models) {
  clearChildren($model);
  if (models.length === 0) {
    var opt = document.createElement('option');
    opt.value = '';
    opt.textContent = '-';
    $model.appendChild(opt);
  } else {
    models.forEach(function(m) {
      var opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m;
      $model.appendChild(opt);
    });
    $model.value = models[0];
  }
}

// 서버 모드 / 로컬 모드에 따라 Endpoint UI 초기화
(function initEndpoint() {
  if (SERVER_MODE) {
    document.getElementById('ep-server').hidden = false;
    document.getElementById('ep-apikey').hidden = true;
    $targetDisplay.textContent = window.__SERVER_CONFIG__.target;
    document.getElementById('versionDisplay').textContent = window.__SERVER_CONFIG__.version || 'unknown';
    populateModels(window.__SERVER_CONFIG__.models);
  } else {
    document.getElementById('ep-local').hidden = false;
    document.getElementById('connectBtn').addEventListener('click', connectToVllm);
    populateModels([]);
  }
})();

function connectToVllm() {
  var base       = document.getElementById('baseUrl').value.trim().replace(/\/+$/, '');
  var statusEl   = document.getElementById('connectStatus');
  var connectBtn = document.getElementById('connectBtn');
  if (!base) { statusEl.className = 'v-err'; statusEl.textContent = 'URL을 입력하세요.'; return; }
  statusEl.className = '';
  statusEl.textContent = '연결 중...';
  connectBtn.disabled = true;

  var apiKey = $apiKey.value.trim();
  var xhr = new XMLHttpRequest();
  xhr.open('GET', base + '/v1/models', true);
  if (apiKey) xhr.setRequestHeader('Authorization', 'Bearer ' + apiKey);
  xhr.onload = function() {
    if (xhr.status >= 400) {
      statusEl.className = 'v-err';
      statusEl.textContent = '✗ ' + xhr.status + ' ' + xhr.statusText;
      connectBtn.disabled = false;
      return;
    }
    var data;
    try { data = JSON.parse(xhr.responseText); } catch (e) {
      statusEl.className = 'v-err';
      statusEl.textContent = '✗ 응답 파싱 실패';
      connectBtn.disabled = false;
      return;
    }
    var models = (data.data || []).map(function(m) { return m.id; }).filter(Boolean);
    if (models.length === 0) {
      statusEl.className = 'v-err';
      statusEl.textContent = '✗ 모델 목록이 비어 있습니다';
      connectBtn.disabled = false;
      return;
    }
    populateModels(models);
    var xhr2 = new XMLHttpRequest();
    xhr2.open('GET', base + '/version', true);
    if (apiKey) xhr2.setRequestHeader('Authorization', 'Bearer ' + apiKey);
    function showDone(version) {
      statusEl.className = 'v-ok';
      statusEl.textContent = '✓ ' + models.length + '개 모델 · vLLM ' + (version || 'unknown');
      connectBtn.disabled = false;
    }
    xhr2.onload = function() {
      var version = '';
      if (xhr2.status < 400) {
        try { var vd = JSON.parse(xhr2.responseText); version = (vd && typeof vd.version === 'string') ? vd.version : ''; } catch (e) {}
      }
      showDone(version);
    };
    xhr2.onerror = function() { showDone(''); };
    xhr2.send();
  };
  xhr.onerror = function() {
    statusEl.className = 'v-err';
    statusEl.textContent = '✗ 연결 실패 (CORS 또는 네트워크 오류)';
    connectBtn.disabled = false;
  };
  xhr.send();
}

function validateRfSchema() {
  var ta  = document.getElementById('hp-rf-schema-ta');
  var val = document.getElementById('hp-rf-schema-val');
  if (!ta.value.trim()) { val.textContent = ''; val.className = 'validation'; return; }
  var r = validateJsonString(ta.value);
  val.textContent = r.msg;
  val.className   = 'validation ' + r.cls;
}
document.getElementById('hp-response_format').addEventListener('change', function() {
  document.getElementById('hp-rf-schema').hidden = this.value !== 'json_schema';
});
document.getElementById('hp-rf-schema-ta').addEventListener('input', validateRfSchema);

document.getElementById('addTool').addEventListener('click', addTool);
document.getElementById('addMessage').addEventListener('click', addMessage);
document.getElementById('clearTools').addEventListener('click', function() {
  clearChildren($toolsItems); checkEmpty($toolsList);
});
document.getElementById('clearMessages').addEventListener('click', function() {
  clearChildren($messagesItems); checkEmpty($messagesList);
});
$sendBtn.addEventListener('click', sendRequest);

document.getElementById('exportBtn').addEventListener('click', exportRequestJson);
document.getElementById('importBtn').addEventListener('click', function() {
  $importFile.value = ''; $importFile.click();
});
$importFile.addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (file) importRequestJson(file);
});

$messagesItems.appendChild(createMessageElement({ role: 'system' }));
$messagesItems.appendChild(createMessageElement({ role: 'user' }));
checkEmpty($messagesList);
</script>

</body>
</html>
